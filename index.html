<!DOCTYPE html>
<html>
    <head>
    <title>CRUD application</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 id="heading">STUDENT CRUD APPLICATION</h1>
        <form>
        <input type="text" id="name" placeholder="Enter student name">
        <br></br>
        <input type="number" id="roll" placeholder="Enter student rollno">
        <br></br>
        <input type="text" id="college" placeholder="Enter college name">
        <br></br>
        <input type="number" id="contact" placeholder="Enter contact number">
        <br></br>
        <button class="student">Add student</button>
        </form>
    
        <h2>Student List</h2>
        <table border="1">
            <th>
                <tr>
                    <th>Name</th>
                    <th>Roll no</th>
                    <th>College name</th>
                    <th>contact number</th>
                </tr>
            </th>
            <tbody id="student table"></tbody>
        </table>
        <script src="project.js"></script>
    </body>


</html>
